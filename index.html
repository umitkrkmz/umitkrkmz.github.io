<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mikro Şehir · Ankara</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Düzen: tam ekran 3B sahne; sol üstte kademe göstergesi, sağ altta seçim kartı ve kontrol paneli.
   Renkler tabela dünyasından: kâğıt grisi zemin, sarı yol levhası vurgusu. */
:root {
  --bg: #dfe3e6; --panel: rgba(247, 248, 246, .88); --fg: #16212b; --muted: #55636e;
  --line: rgba(22, 33, 43, .2); --accent: #b85c00; --warn: #b3261e;
  --f-display: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d141b; --panel: rgba(18, 26, 34, .86); --fg: #e8edf0; --muted: #9aa8b3;
    --line: rgba(232, 237, 240, .2); --accent: #ffb53d; --warn: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d141b; --panel: rgba(18, 26, 34, .86); --fg: #e8edf0; --muted: #9aa8b3;
  --line: rgba(232, 237, 240, .2); --accent: #ffb53d; --warn: #ff8a80; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--bg); color: var(--fg);
  font: 14px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#stage { position: fixed; inset: 0; background: var(--bg); }
#stage canvas { display: block; }
.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.btn {
  font: 500 12px/1 var(--f-mono); letter-spacing: .04em; text-transform: uppercase;
  min-height: 36px; padding: 8px 10px; border: 1px solid var(--line); background: transparent;
  color: var(--fg); border-radius: 6px; cursor: pointer;
}
.btn:hover:not([disabled]) { border-color: var(--fg); }
.btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.danger { color: var(--warn); }
.btn[disabled] { opacity: .4; cursor: default; }

/* sol sütun: kademe göstergesi ve olay akışı */
.left {
  position: fixed; left: max(16px, env(safe-area-inset-left, 0px));
  top: max(14px, calc(env(safe-area-inset-top, 0px) + 8px));
  width: min(300px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.brand { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.brand-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font: 800 30px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.district { margin-top: 3px; font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); min-height: 1em; }
.zoom { font: 800 26px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.zoom small { font: 500 12px var(--f-mono); color: var(--muted); margin-left: 3px; }
.steps { display: flex; gap: 6px; }
.steps span {
  flex: 1; min-width: 0; padding-top: 6px; border-top: 3px solid var(--line);
  font: 500 10.5px/1.2 var(--f-mono); letter-spacing: .03em; text-transform: uppercase; color: var(--muted);
}
.steps span.seen { border-top-color: var(--fg); }
.steps span.on { border-top-color: var(--accent); color: var(--fg); }
.desc { margin: 0; font-size: 13px; min-height: 2.9em; }
.scale { display: flex; align-items: center; gap: 8px; font: 500 11px var(--f-mono); color: var(--muted); }
.scale i { display: block; height: 6px; width: 60px; border: 1.5px solid var(--fg); border-top: none; }
.hint { margin: 0; font-size: 11.5px; color: var(--muted); }

/* sağ alt: seçim kartı + kontrol paneli */
.stack {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px));
  bottom: max(16px, calc(env(safe-area-inset-bottom, 0px) + 8px));
  width: min(300px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  /* her ekranda üstte Portfolyo düğmesine yer kalır; kart ve panel bu yüksekliği paylaşır, panelin içi kayar (tablet, dizüstü, yatay telefon) */
  max-height: calc(100vh - 76px - env(safe-area-inset-bottom, 0px)); max-height: calc(100dvh - 76px - env(safe-area-inset-bottom, 0px));
}
.stack > * { pointer-events: auto; }
.stack > .card { flex: 0 0 auto; max-height: 45vh; max-height: 45dvh; overflow-y: auto; overscroll-behavior: contain; }   /* kart küçülmez, yer gerekirse panel kısalır */
.stack > .dock { flex: 0 1 auto; min-height: 44px; display: flex; flex-direction: column; }
.dock-body { min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.card { padding: 12px 14px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h2 { margin: 0; font: 800 22px/1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; }
.x { width: 32px; min-height: 32px; padding: 0; font-size: 16px; line-height: 1; }
.rows { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin: 12px 0; }
.rows dt { font: 500 10.5px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.rows dd { margin: 0; font: 600 15px var(--f-body); font-variant-numeric: tabular-nums; }
.rows > div { min-width: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }

.dock { overflow: hidden; }
.dock-toggle {
  display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 14px; border: 0; background: transparent; color: var(--fg); cursor: pointer;
  font: 500 12px var(--f-mono); letter-spacing: .05em; text-transform: uppercase;
}
.dock-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.dock-toggle svg { transition: transform .2s; }
.dock-toggle[aria-expanded="false"] svg { transform: rotate(180deg); }
.dock-body { display: flex; flex-direction: column; gap: 14px; padding: 4px 14px 14px; }
.dock.collapsed .dock-body { display: none; }
.field-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
.field label, .field .lbl, .check { font: 500 11px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.field output { font: 500 13px var(--f-mono); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.hour-r { display: flex; align-items: center; gap: 8px; }
.btn.tiny { min-height: 24px; padding: 3px 8px; font-size: 10.5px; }
.btn.tiny.on { color: #1f9d55; border-color: currentColor; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.tiny.on { color: #5ee08f; } }
:root[data-theme="dark"] .btn.tiny.on { color: #5ee08f; }
/* hava seçimi: sekiz simge, canlıdayken o anki tür işaretli */
.wx-pick { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.wxb { min-height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: transparent; font-size: 15px; line-height: 1; cursor: pointer; filter: grayscale(.35); opacity: .8; }
.wxb:hover { opacity: 1; filter: none; }
.wxb[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); filter: none; opacity: 1; }
.wx-note { margin-top: 5px; font: 500 10.5px/1.35 var(--f-mono); color: var(--muted); min-height: 14px; }
.sel { width: 100%; min-height: 32px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); font: 500 12px var(--f-mono); }
.sel option { color: #16212b; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.row2 .wide { grid-column: 1 / -1; }
.opts { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* telefonda kontroller: ekranın en çok yarısını kaplayan, içinde kayan kompakt alt sayfa (Portfolyo düğmesine ve şehre yer kalsın) */
@media (max-width: 719px), (max-height: 560px) {
  .dock-body { max-height: min(48vh, 440px); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; gap: 10px; padding: 2px 12px 12px; }
  .dock-toggle { padding: 9px 12px; }
  .dock .btn { min-height: 32px; padding: 6px 8px; font-size: 11px; letter-spacing: .02em; }
  .dock .btn.tiny { min-height: 24px; padding: 3px 7px; font-size: 10px; }
  .dock .row2 { grid-template-columns: repeat(2, 1fr); gap: 5px; }
  .dock .wxb { min-height: 28px; font-size: 14px; }
  .dock .field-top { margin-bottom: 2px; }
  .dock .sel { min-height: 30px; }
}
/* kısa ekran (yatay telefon): panel yığının sınırıyla kayar; sol üst başlıkta yalnızca ad, semt ve kademe */
@media (max-height: 560px) {
  .dock-body { max-height: none; }
  .desc, .scale, .hint { display: none; }
  .brand { padding: 9px 12px; gap: 7px; }
  h1 { font-size: 24px; }
  .feed li:nth-child(n+3) { display: none; }
}
#boot, #nogl {
  position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 24px; text-align: center;
  background: var(--bg); color: var(--muted); font: 500 13px var(--f-mono); letter-spacing: .08em; text-transform: uppercase;
}
@media (max-width: 719px) {
  .stack { left: max(16px, env(safe-area-inset-left, 0px)); width: auto; }
  .steps span { font-size: 9.5px; letter-spacing: 0; }
  .hint { display: none; }
  .desc, .scale { display: none; }   /* telefonda kısa: ad, semt, kademe */
  .brand { padding: 9px 12px; gap: 7px; }
  h1 { font-size: 24px; }
  .left { width: min(240px, calc(100vw - 150px)); }
}
/* olay akışı */
.feed { pointer-events: auto; padding: 8px 6px 6px; }
.feed-head { padding: 0 8px 4px; font: 500 11px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.feed ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.feed-item {
  display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; width: 100%; padding: 6px 8px; text-align: left;
  border: 0; border-radius: 6px; background: transparent; color: var(--fg); cursor: pointer; font: inherit;
  transition: background-color .6s;
}
.feed-item:hover { background: var(--line); }
.feed-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.feed-item.fresh { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.feed-item .ft { grid-row: span 2; font: 500 12px var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); padding-top: 1px; }
.feed-item .fb { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.feed-item b { font: 800 15px/1.1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.feed-item b::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 2px; background: var(--dot); }
.feed-item[data-type="fire"] { --dot: #e2452b; } .feed-item[data-type="accident"] { --dot: #f2a516; } .feed-item[data-type="crime"] { --dot: #2f7bff; } .feed-item[data-type="pedestrian"] { --dot: #d6336c; }
.feed-item .fp { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.feed-item .fs { font: 500 11px var(--f-mono); letter-spacing: .03em; text-transform: uppercase; color: var(--accent); }
.feed-item.done .fs { color: var(--muted); }
@media (max-width: 719px) { .feed li:nth-child(n+3) { display: none; } }

/* karakter modu */
#playHud { position: fixed; left: 50%; bottom: max(16px, calc(env(safe-area-inset-bottom, 0px) + 8px)); transform: translateX(-50%);
  padding: 8px 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; max-width: calc(100vw - 32px); pointer-events: none; }
.play-keys { font: 500 11px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); text-align: center; }
.play-lock { font: 600 13px var(--f-body); color: var(--accent); }
.play-prompt { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px;
  background: var(--panel); border: 1px solid var(--line); font: 800 18px var(--f-display); letter-spacing: .06em; text-transform: uppercase; pointer-events: none; }
#bubbles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.bubble { position: absolute; left: 0; top: 0; max-width: 220px; padding: 7px 11px; border-radius: 12px; background: #fffdf6; color: #16212b;
  font: 500 13px/1.3 var(--f-body); box-shadow: 0 2px 8px rgba(0,0,0,.25); white-space: normal; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #fffdf6; }
body.playing .stack .card, body.playing .feed { display: none; }
/* telefon (portfolyo): masaüstünde sağ altta çerçeveli telefon, telefonda tam ekran; sağ üstte X */
.btn.find { background: var(--accent); color: #16212b; border-color: transparent; font-weight: 600; }
.phone-btn { position: fixed; top: max(14px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 30;
  padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); backdrop-filter: blur(8px);
  font: 800 15px var(--f-display); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.phone-btn:hover { border-color: var(--accent); }
.phone-btn:focus-visible, .phone-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
body.playing .phone-btn { top: auto; bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
.phone { position: fixed; right: 28px; bottom: 24px; z-index: 40; width: 372px; height: min(760px, calc(100vh - 48px)); transform: translateY(calc(100% + 40px)); transition: transform .36s cubic-bezier(.2, .8, .2, 1); }
.phone.open { transform: none; }
.phone.full { right: 3vw; bottom: 3vh; width: 94vw; height: 94vh; transition: transform .36s cubic-bezier(.2, .8, .2, 1), width .32s cubic-bezier(.2, .8, .2, 1), height .32s cubic-bezier(.2, .8, .2, 1), right .32s, bottom .32s; }
.phone.full .phone-frame { border-radius: 18px; padding: 6px; }
.phone.full .phone-bar { display: none; }
.phone.full iframe { border-radius: 13px; }
.phone-close.phone-full { right: 34px; font-size: 18px; }   /* X'in solunda (aynı sınıf: sonraki .phone-close kuralı ezmesin) */
.phone-frame { position: absolute; inset: 0; border-radius: 46px; background: #0b0d10; padding: 12px; box-shadow: 0 0 0 2px #2b3036, 0 24px 60px rgba(0,0,0,.45); display: flex; flex-direction: column; overflow: hidden; }
.phone-bar { display: flex; align-items: center; justify-content: space-between; height: 30px; padding: 0 22px; color: #f2f2ee; font: 600 13px var(--f-body); flex: none; }
.phone-notch { width: 96px; height: 24px; border-radius: 14px; background: #000; }
.phone-icons { font: 600 11px var(--f-mono); display: flex; align-items: center; gap: 6px; }
.phone-icons i { display: inline-block; width: 22px; height: 11px; border: 1.5px solid #f2f2ee; border-radius: 3px; position: relative; }
.phone-icons i::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; background: #f2f2ee; border-radius: 1px; }
.phone iframe { flex: 1; width: 100%; border: 0; border-radius: 34px; background: #10161c; }
.phone-close { position: absolute; top: -14px; right: -14px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  font: 600 24px/1 var(--f-body); cursor: pointer; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
body.phone-open .phone-btn { display: none; }
@media (max-width: 719px) { .brand .zoom { visibility: hidden; } .phone-btn { padding: 7px 11px; font-size: 13px; } }   /* telefonda düğme mesafe yazısının yerinde */
@media (max-width: 719px), (max-height: 560px) {
  .phone { inset: 0; width: auto; height: auto; transform: translateY(100%); }
  .phone-frame { border-radius: 0; padding: 0; padding-top: env(safe-area-inset-top, 0px); box-shadow: none; background: #10161c; }
  .phone-bar { display: none; }
  .phone iframe { border-radius: 0; }
  .phone-close { top: max(10px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); background: rgba(16,22,28,.75); color: #f2f2ee; border-color: rgba(255,255,255,.25); }
  .phone.full { inset: 0; width: auto; height: auto; }
  .phone.full .phone-frame { border-radius: 0; padding: 0; }
  .phone.full iframe { border-radius: 0; }
  .phone-full { display: none; }   /* telefonda zaten tam ekran */
}
@media (prefers-reduced-motion: reduce) { .phone { transition: none; } }
/* dokunmatik oyun: joystick ve düğmeler, yalnızca dokunmatikte ve oyunda */
.touch-ui { display: none; }
body.touch.playing .touch-ui { display: block; }
body.touch.playing #playHud { bottom: auto; top: max(62px, calc(env(safe-area-inset-top, 0px) + 56px)); transition: opacity .6s; }
body.touch.playing #playHud.fade { opacity: 0; }
body.touch.playing .left, body.touch.playing .stack { display: none; }   /* telefonda oynarken üst panel ve kontroller gizli; Çık düğmesi var */
.tb.exit { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); top: max(12px, env(safe-area-inset-top, 0px)); width: auto; height: 40px; padding: 0 14px; border-radius: 20px; z-index: 26; }
body.touch.playing .play-prompt { bottom: 200px; }
body.touch.playing .phone-btn { top: max(14px, env(safe-area-inset-top, 0px)); bottom: auto; }
.stick { position: fixed; left: max(22px, env(safe-area-inset-left, 0px)); bottom: max(28px, env(safe-area-inset-bottom, 0px)); width: 128px; height: 128px; border-radius: 50%;
  background: rgba(16, 22, 28, .32); border: 2px solid rgba(255, 255, 255, .35); touch-action: none; z-index: 25; }
.knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255, 255, 255, .7); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.tbtns { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(24px, env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(2, 64px); gap: 10px; z-index: 25; }
.tb { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .4); background: rgba(16, 22, 28, .5); color: #f2f2ee;
  font: 800 15px var(--f-display); letter-spacing: .05em; text-transform: uppercase; touch-action: none; -webkit-user-select: none; user-select: none; }
.tb.big { grid-column: 1 / -1; width: 138px; border-radius: 32px; }
.tb.on, .tb[aria-pressed="true"] { background: var(--accent); color: #16212b; border-color: transparent; }
body:not(.hero-mode) .hero-only, body.hero-mode .cit-only { display: none; }
#xhair { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; pointer-events: none;
  border: 2px solid rgba(255,255,255,.55); box-shadow: 0 0 0 1px rgba(0,0,0,.25); transition: transform .12s, border-color .12s; }
#xhair::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(255,255,255,.85); }
#xhair.on { border-color: var(--accent); transform: scale(.78); }
.hero-task { position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: flex; gap: 8px; align-items: center;
  padding: 7px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font: 600 13px var(--f-body); pointer-events: none; max-width: calc(100vw - 32px); white-space: nowrap; }
.hero-task .arrow { display: inline-block; font-size: 17px; line-height: 1; color: #2f7bff; }
.hero-task .txt { overflow: hidden; text-overflow: ellipsis; }
.hero-msg { position: fixed; left: 50%; top: 62px; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line);
  font: 800 16px var(--f-display); letter-spacing: .05em; text-transform: uppercase; pointer-events: none; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="stage"></div>

<div class="left">
<header class="brand panel">
  <div class="brand-top">
    <div><h1>Mikro Şehir</h1><div class="district" id="district"></div></div>
    <div class="zoom" title="Kameranın hedefe uzaklığı"><span id="zoomM">—</span><small>m</small></div>
  </div>
  <div class="steps" id="steps" role="list" aria-label="Ayrıntı kademesi">
    <span role="listitem">Şehir</span><span role="listitem">Mahalle</span><span role="listitem">Sokak</span><span role="listitem">Göz hizası</span>
  </div>
  <p class="desc" id="lodDesc"></p>
  <div class="scale"><i id="scaleBar"></i><b id="scaleLbl" style="font-weight:500"></b></div>
  <p class="hint" id="hint"></p>
</header>
<section class="feed panel" id="feed" aria-label="Olay akışı" hidden>
  <div class="feed-head">Olaylar · tıkla, oraya git</div>
  <ol id="feedList" aria-live="polite"></ol>
</section>
</div>

<div class="stack">
  <section class="card panel" id="selCard" hidden aria-live="polite">
    <div class="card-head">
      <h2 id="selTitle"></h2>
      <button class="btn x" id="selClose" aria-label="Seçimi kaldır">×</button>
    </div>
    <dl class="rows" id="selRows"></dl>
    <div class="actions" id="selActions"></div>
  </section>

  <section class="dock panel" id="dock">
    <button class="dock-toggle" id="dockToggle" aria-expanded="true" aria-controls="dockBody">
      <span>Kontroller</span>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 5l5 5 5-5"/></svg>
    </button>
    <div class="dock-body" id="dockBody">
      <div class="field">
        <div class="field-top"><label for="hour">Saat</label><span class="hour-r"><button class="btn tiny on" id="nowBtn" aria-pressed="true" title="Gerçek Türkiye saati (GMT+3)">● Canlı</button><output id="hourOut" for="hour">16:30</output></span></div>
        <input type="range" id="hour" min="0" max="24" step="0.05" value="16.5">
      </div>
      <div class="field">
        <div class="field-top"><span class="lbl" id="wxLbl">Hava</span><span class="hour-r"><button class="btn tiny on" id="wxLive" aria-pressed="true">● Canlı</button><output id="wxOut">…</output></span></div>
        <div class="wx-pick" id="wxPick" role="group" aria-labelledby="wxLbl"></div>
        <div class="wx-note" id="wxNote" aria-live="polite"></div>
      </div>
      <div class="field">
        <div class="field-top"><label for="traffic">Trafik yoğunluğu</label><output id="trafficOut" for="traffic">50%</output></div>
        <input type="range" id="traffic" min="0" max="100" step="5" value="50">
      </div>
      <div class="opts">
        <label class="check"><input type="checkbox" id="shadowChk" checked> Gölgeler</label>
        <button class="btn" id="playBtn" aria-pressed="false">Günü ilerlet</button>
      </div>
      <div class="opts">
        <label class="check"><input type="checkbox" id="eventsChk" checked> Rastgele olaylar</label>
        <button class="btn" id="eventBtn">Olay çıkar</button>
      </div>
      <div class="field">
        <div class="field-top"><label for="quality">Grafik</label><output id="qualityNow"></output></div>
        <select id="quality" class="sel"><option value="auto">Otomatik (cihaza göre)</option><option value="high">Yüksek</option><option value="mid">Orta</option><option value="low">Düşük (telefon)</option></select>
        <div class="wx-note" id="qualityNote"></div>
      </div>
      <div class="field">
        <div class="field-top"><label for="lang">Dil · Language</label></div>
        <select id="lang" class="sel"><option value="auto">Otomatik</option><option value="tr">Türkçe</option><option value="en">English</option></select>
      </div>
      <div class="row2">
        <button class="btn wide find" id="btnFindMe">Beni bul 📱</button>
        <button class="btn" id="btnOverview">Kuş bakışı</button>
        <button class="btn" id="btnCenter">Siluet</button>
        <button class="btn" id="btnStreet">Sokağa in</button>
        <button class="btn" id="btnClock">Saat kulesi</button>
        <button class="btn wide" id="btnPlay" aria-pressed="false">Karakteri oyna</button>
        <button class="btn wide" id="btnHero" aria-pressed="false">Pijamalı Çocuğu izle</button>
        <button class="btn wide" id="btnPlayHero" aria-pressed="false">Pijamalı Çocuk olarak oyna</button>
        <button class="btn wide" id="btnNew">Yeni şehir kur</button>
      </div>
    </div>
  </section>
</div>

<div id="bubbles" aria-live="polite"></div>
<div id="playHud" class="panel" hidden>
  <div class="play-keys" id="playKeys"></div>
  <div id="playLock" class="play-lock" hidden>Fareyle bakmak için sahneye tıkla</div>
</div>
<div id="playPrompt" class="play-prompt" hidden></div>
<div id="xhair" hidden></div>
<div id="touchUI" class="touch-ui" aria-hidden="true">
  <button class="tb exit" id="tbExit" aria-label="Kuş bakışına dön">‹ Çık</button>
  <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
  <div class="tbtns">
    <button class="tb big" data-key="Space">Zıpla</button>
    <button class="tb" data-key="KeyE">E</button>
    <button class="tb" id="tbRun" aria-pressed="false">Koş</button>
    <button class="tb hero-only" data-key="KeyF">Ağ</button>
    <button class="tb hero-only" data-key="KeyQ">Çekil</button>
    <button class="tb cit-only" data-key="KeyQ">Kucak</button>
  </div>
</div>
<button id="phoneBtn" class="phone-btn" aria-label="Portfolyoyu aç"><span aria-hidden="true">📱</span> Portfolyo</button>
<div id="phone" class="phone" role="dialog" aria-modal="true" aria-label="Portfolyo telefonu" hidden>
  <div class="phone-frame">
    <div class="phone-bar"><span id="phoneTime">12:00</span><span class="phone-notch" aria-hidden="true"></span><span class="phone-icons" aria-hidden="true">5G <i></i></span></div>
    <iframe id="phoneFrame" title="Portfolyo"></iframe>
  </div>
  <button id="phoneClose" class="phone-close" aria-label="Telefonu kapat">×</button>
  <button id="phoneFull" class="phone-close phone-full" aria-label="Tam ekran" aria-pressed="false">⤢</button>
</div>
<div id="heroTask" class="hero-task" hidden><span class="arrow" aria-hidden="true">↑</span><span class="txt"></span></div>
<div id="heroMsg" class="hero-msg" hidden aria-live="polite"></div>
<div id="boot">Şehir kuruluyor…</div>
<div id="nogl" hidden>Bu tarayıcıda WebGL açık değil. Donanım hızlandırmayı açıp sayfayı yenileyin.</div>
