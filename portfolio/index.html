<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zeynel Ümit Korkmaz · Portfolyo</title>
<meta name="description" content="Zeynel Ümit Korkmaz: projeler, hakkımda, iletişim. Mikro Şehir'in içindeki telefonda da açılır.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="enter-city" id="enterCity" href="../index.html">Şehre gir</a>
<button class="full-btn" id="fullBtn" aria-label="Tam ekran" aria-pressed="false">⤢</button>
<button class="lang-btn" id="langBtn" aria-label="Dil · Language"></button>
<main class="device" id="device">
  <div class="wall" aria-hidden="true"></div>

  <!-- ana ekran -->
  <section class="screen home" id="home" aria-label="Ana ekran">
    <div class="home-top">
      <div class="clock" id="clock">12:00</div>
      <div class="date" id="date"></div>
    </div>
    <div class="widget">
      <div class="who">
        <div class="avatar" aria-hidden="true" id="avatar">Ü</div>
        <div><h1 id="name"></h1><p id="role"></p></div>
      </div>
      <p class="tag" id="tagline"></p>
      <span class="pill" id="status"></span>
    </div>
    <div class="minis" id="minis" aria-label="Araçlar"></div>
    <nav class="apps" aria-label="Uygulamalar">
      <button class="app" data-open="projects"><span class="ico" style="--c:#ff9f43" data-icon="folder"></span>Projeler</button>
      <button class="app" data-open="about"><span class="ico" style="--c:#54a0ff" data-icon="user"></span>Hakkımda</button>
      <button class="app" data-open="contact"><span class="ico" style="--c:#1dd1a1" data-icon="chat"></span>İletişim</button>
      <button class="app" data-open="city"><span class="ico" style="--c:#ffb53d" data-icon="news"></span>Ankara Haber</button>
    </nav>
    <div class="dockbar" aria-label="Kısayollar" id="dockbar"></div>
  </section>

  <!-- uygulamalar: açılınca tam ekran (şehirde telefon büyür) -->
  <section class="screen app-view" id="projects" aria-label="Projeler" hidden>
    <header><div class="url" data-path="projeler"></div><button class="back" data-home>‹ Ana ekran</button><h2>Projeler</h2></header>
    <div class="body"><div id="projectList"></div><a class="more" id="moreLink" target="_blank" rel="noopener"></a></div>
  </section>
  <section class="screen app-view" id="project" aria-label="Proje" hidden>
    <header><div class="url" data-path="projeler"></div><button class="back" data-to="projects">‹ Projeler</button><h2 id="pjTitle"></h2><div class="sub" id="pjSub"></div></header>
    <div class="body" id="pjBody"></div>
  </section>
  <section class="screen app-view" id="about" aria-label="Hakkımda" hidden>
    <header><div class="url" data-path="hakkimda"></div><button class="back" data-home>‹ Ana ekran</button><h2>Hakkımda</h2></header>
    <div class="body"><div class="lead" id="aboutText"></div><p class="edu" id="edu"></p><h3>Neyle uğraşıyorum</h3><ul class="skillrows" id="skills"></ul></div>
  </section>
  <section class="screen app-view" id="contact" aria-label="İletişim" hidden>
    <header><div class="url" data-path="iletisim"></div><button class="back" data-home>‹ Ana ekran</button><h2>İletişim</h2></header>
    <div class="body"><ul class="rows" id="contactList"></ul></div>
  </section>
  <section class="screen app-view news" id="city" aria-label="Ankara Haber" hidden>
    <header><div class="url" data-path="ankara-haber"></div><button class="back" data-home>‹ Ana ekran</button><h2>Ankara Haber</h2><p class="sub" id="cityNow"></p></header>
    <div class="body">
      <div class="grid two">
        <article class="card weather" id="cityWeather"></article>
        <article class="card match" id="cityMatch"></article>
      </div>
      <h3>Son dakika</h3><div id="cityBreaking"></div>
      <h3>Gündem</h3><div class="grid" id="cityNews"></div>
      <h3>Şehir rakamları</h3><div class="stats" id="cityStats"></div>
      <h3>Bu şehir nasıl yapıldı</h3><div id="cityHow"></div>
    </div>
  </section>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="home-ind" aria-hidden="true"></div>
</main>
<script src="../js/lang.js"></script>
<script src="../js/lang.en.js"></script>
<script src="lang.en.js"></script>
<script src="../js/wxdata.js"></script>
<script src="icons.js"></script>
<script src="content.js"></script>
<script src="details.js"></script>
<script src="news.js"></script>
<script src="app.js"></script>
</body>
</html>
